name: VeyraQuant Brief And Alerts

on:
  schedule:
    # Nightly full pipeline, shortly after the US close. Two offsets cover
    # Sydney DST both ways (20:30 UTC = 7:30 AEDT, 21:30 UTC = 7:30 AEST);
    # the already-sent-today guard dedups whichever run is the second one.
    - cron: "30 20 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without sending email or updating state"
        required: false
        default: "false"
      force_send:
        description: "Force-send a daily brief without waiting for the send window"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: veyraquant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  send-brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall report.py veyraquant

      - name: Create private positions file
        env:
          POSITIONS_JSON: ${{ secrets.POSITIONS_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = os.getenv("POSITIONS_JSON", "").strip()
          if not payload:
              print("No POSITIONS_JSON secret configured; running without private position context.")
              raise SystemExit(0)

          json.loads(payload)
          Path("state").mkdir(exist_ok=True)
          Path("state/positions.json").write_text(payload, encoding="utf-8")
          print("Private positions file created for this workflow run.")
          PY

      - name: Run report
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          SYMBOLS: "NVDA,TSLA,AAPL,AMD,MU,QQQ,SMH"
          MARKET_SYMBOLS: "SPY,QQQ,SMH,^VIX"
          SEND_HOUR: "7"
          SEND_MINUTE: "30"
          SEND_WINDOW_MINUTES: "30"
          ENABLE_ENTRY_ALERTS: "true"
          ALERT_COOLDOWN_HOURS: "12"
          ALERT_SCORE_THRESHOLD: "65"
          SOCIAL_SENTIMENT_THRESHOLD: "0.15"
          INTRADAY_INTERVAL: "30m"
          RISK_PER_TRADE_PCT: "0.5"
          MAX_POSITION_PCT: "10"
          PORTFOLIO_HEAT_MAX_PCT: "3"
          ATR_STOP_MULTIPLIER: "2.0"
          MIN_RR: "1.5"
          POSITIONS_PATH: "state/positions.json"
          SUBJECT_PREFIX: "VeyraQuant 量化简报"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          FORCE_DAILY_REPORT: ${{ github.event.inputs.force_send || 'false' }}
        run: |
          python report.py

      - name: Commit state if updated
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -n "$(git status --porcelain state/last_sent.json state/armed_plans.json docs/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/last_sent.json
            git add --ignore-errors state/armed_plans.json docs/data || true
            git commit -m "Update send state, armed plans and dashboard data"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "No state changes to commit."
          fi
