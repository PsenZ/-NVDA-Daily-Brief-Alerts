<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>VeyraQuant 驾驶舱</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 data-i18n="title">VeyraQuant 驾驶舱</h1>
    <span id="sample-badge" class="badge-sample" hidden data-i18n="sample">样例数据</span>
    <nav class="lang" aria-label="language">
      <button id="lang-zh" class="on" aria-pressed="true">中文</button>
      <button id="lang-en" aria-pressed="false">EN</button>
    </nav>
  </header>
  <p class="stamp" id="stamp"></p>
  <p class="stale" id="stale" hidden></p>

  <section class="card" id="card-regime">
    <h2 data-i18n="sec.market">市场滤镜</h2>
    <div id="regime" class="regime"></div>
    <div id="chips" class="chips"></div>
    <ul id="mkt-lines" class="mkt-lines"></ul>
  </section>

  <section class="card">
    <h2 data-i18n="sec.funnel">审批漏斗</h2>
    <div id="funnel" class="funnel"></div>
  </section>

  <section class="card">
    <h2 data-i18n="sec.armed">冻结计划（盘中触发状态）</h2>
    <div id="armed"></div>
  </section>

  <section class="card">
    <h2 data-i18n="sec.actions">今日批准计划</h2>
    <div id="actions"></div>
  </section>

  <section class="card">
    <h2 data-i18n="sec.contrib">评分贡献</h2>
    <div class="legend">
      <span class="p"><i></i><span data-i18n="legend.pos">正贡献</span></span>
      <span class="n"><i></i><span data-i18n="legend.neg">负贡献</span></span>
    </div>
    <div id="contrib"></div>
  </section>

  <section class="card">
    <h2 data-i18n="sec.watch">观察 / 延后</h2>
    <div id="watch" class="scroll-x"></div>
  </section>

  <section class="card">
    <h2 data-i18n="sec.risk">风险动作</h2>
    <div id="risk"></div>
  </section>

  <section class="card">
    <h2 data-i18n="sec.rejected">被拒计划</h2>
    <div id="rejected"></div>
  </section>

  <section class="card">
    <h2 data-i18n="sec.notes">系统备注与决策复盘</h2>
    <ul id="notes" class="notes"></ul>
  </section>

  <footer data-i18n="disclaimer">
    不连接券商 API。不自动下单。不构成投资建议。所有交易计划需要人工复核。
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
